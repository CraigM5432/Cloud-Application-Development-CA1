databases:
  - name: multitasking_db
    databaseName: multitasking_db
    user: multitasking_user
    plan: free

services:
  - type: web
    name: multitasking_app
    runtime: ruby
    plan: free

    buildCommand: |
      bundle install
      bundle exec rails db:migrate

    startCommand: |
      bundle exec rails server -p $PORT -e production

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: multitasking_db
          property: connectionString

      - key: RAILS_MASTER_KEY
        sync: false

      - key: WEB_CONCURRENCY
        value: 2


